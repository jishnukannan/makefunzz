# cutest-picture-01: make the cutest picture of anything, judged by the house AI judge (program/v1 + harness.judge,
# media image), cutest-cat-01's format with no subject restriction, on makefun-sticker-01's $250 twenty-place table. The
# owner asked for it on 2026-11-12 ("1 for making the cutest picture (like cutest dog/cat but just cutest picture) ...
# both AI judged, ... run for 24h and give $250 in prizes each, with $50 going to the #1 spot on each"). It is the lead
# of two twins: coolest-art-01 takes every sentence here that is not about cuteness. Each entry's program writes one
