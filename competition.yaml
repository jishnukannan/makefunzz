# An exact tie on the win rate goes to the entry that took more of the playoff games between the tied entries (its
# score's head_to_head), then to the smaller image file, the Size column (performance.judge.artifact_bytes, sorting
# asc, leaderboard.tie_break_index), then to the earlier receipt, the tied entries placing in the order they were
